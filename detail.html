<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章详情</title>
    <!-- marked.js CDN，用于解析markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        /* 和首页完全一致的背景 */
        background: linear-gradient(160deg, #e8f0fe 0%, #f0f4f9 100%);
        color: #2d3748;
        line-height: 1.7;
        padding: 40px 20px;
        background-image:
          linear-gradient(160deg, #e8f0fe 0%, #f0f4f9 100%),
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        background-blend-mode: soft-light;
        background-size:
          100% 100%,
          120px 120px;
        background-attachment: fixed;
      }

      /* 大卡片容器，四周留白，居中 */
      .article-container {
        max-width: 800px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      /* 返回按钮 */
      .back-btn {
        display: inline-block;
        margin-bottom: 24px;
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 8px;
        text-decoration: none;
        color: #2b6cb0;
        transition: 0.2s;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.9);
      }

      .article-title {
        font-size: 2rem;
        color: #2b6cb0;
        margin-bottom: 8px;
      }
      .article-date {
        color: #718096;
        font-size: 14px;
        margin-bottom: 32px;
      }

      /* Markdown渲染后的内容样式 */
      .md-content h1 {
        font-size: 1.8rem;
        margin: 1.6rem 0 0.8rem;
      }
      .md-content h2 {
        font-size: 1.5rem;
        margin: 1.4rem 0 0.7rem;
      }
      .md-content h3 {
        font-size: 1.25rem;
        margin: 1.2rem 0 0.6rem;
      }
      .md-content p {
        margin-bottom: 1rem;
      }
      .md-content ul,
      .md-content ol {
        padding-left: 2rem;
        margin-bottom: 1rem;
      }
      .md-content blockquote {
        border-left: 4px solid #cbd5e0;
        padding-left: 1rem;
        color: #4a5568;
        margin: 1rem 0;
      }
      .md-content pre {
        background: #f7fafc;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        margin: 1rem 0;
      }
      .md-content code {
        background: #f7fafc;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .md-content a {
        color: #2b6cb0;
      }

      .error-tip {
        text-align: center;
        font-size: 1.2rem;
        color: #c53030;
        padding: 40px 0;
      }
    </style>
  </head>
  <body>
    <div class="article-container">
      <a class="back-btn" href="index.html">← 返回首页</a>
      <div id="article-area"></div>
    </div>

    <script>
      const articleArea = document.getElementById("article-area");

      // 获取url参数 ?post=1
      function getUrlParam(name) {
        const params = new URLSearchParams(location.search);
        return params.get(name);
      }

      async function loadArticle() {
        const postNum = getUrlParam("post");
        // 校验是否是数字
        if (!postNum || isNaN(postNum)) {
          articleArea.innerHTML = `<div class="error-tip">文章编号无效</div>`;
          return;
        }
        const folderName = `post${postNum}`;
        const metaUrl = `./intro/${folderName}/meta.json`;
        try {
          // 读取meta
          const metaResp = await fetch(metaUrl);
          if (!metaResp.ok) throw new Error("not found");
          const meta = await metaResp.json();
          // 读取md正文
          const mdUrl = `./intro/${folderName}/${meta.mdFile}`;
          const mdResp = await fetch(mdUrl);
          const mdRaw = await mdResp.text();
          // md转html
          const htmlContent = marked.parse(mdRaw);

          articleArea.innerHTML = `
          <h1 class="article-title">${meta.title}</h1>
          <div class="article-date">${meta.date}</div>
          <div class="md-content">${htmlContent}</div>
        `;
        } catch (err) {
          console.error(err);
          articleArea.innerHTML = `<div class="error-tip">这篇文章不存在</div>`;
        }
      }
      loadArticle();
    </script>
  </body>
</html>
